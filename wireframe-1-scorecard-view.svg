<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="720" viewBox="0 0 1060 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .frame { fill: #ffffff; stroke: #444; stroke-width: 2; }
      .box { fill: #f2f2f2; stroke: #999; stroke-width: 1.2; }
      .boxdark { fill: #e4e4e4; stroke: #999; stroke-width: 1.2; }
      .label { font-size: 13px; fill: #333; }
      .small { font-size: 11px; fill: #666; }
      .h1 { font-size: 17px; font-weight: bold; fill: #222; }
      .h2 { font-size: 13px; font-weight: bold; fill: #333; }
      .badge { fill: #ddd; stroke: #888; stroke-width: 1; }
      .scorebar { fill: #bbb; }
      .scoretrack { fill: #eee; stroke: #ccc; stroke-width: 0.5; }
      .callout { fill: #eef4fb; stroke: #4a7ba6; stroke-width: 1; }
      .callouttext { font-size: 11px; fill: #1f3d5c; }
      .calloutline { stroke: #4a7ba6; stroke-width: 1; stroke-dasharray: 4 3; }
      .btn { fill: #e9e9e9; stroke: #888; stroke-width: 1.2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1060" height="720" fill="#fafafa"/>
  <text x="30" y="30" class="h1">Wireframe 1 — Scorecard View (Analyst)</text>
  <text x="30" y="48" class="small">Low-fidelity · Transition Monitor · links to FRD requirements shown in blue</text>

  <!-- App frame -->
  <rect class="frame" x="30" y="65" width="760" height="620"/>

  <!-- Top bar -->
  <rect class="boxdark" x="30" y="65" width="760" height="48"/>
  <text x="50" y="94" class="h2">Transition Monitor</text>
  <rect class="box" x="600" y="76" width="80" height="26"/>
  <text x="614" y="93" class="small">Analyst ▾</text>
  <rect class="box" x="692" y="76" width="80" height="26"/>
  <text x="706" y="93" class="small">Help</text>

  <!-- Filter bar -->
  <rect class="box" x="50" y="130" width="130" height="30"/>
  <text x="62" y="149" class="small">Year: 2026 ▾</text>
  <rect class="box" x="192" y="130" width="150" height="30"/>
  <text x="204" y="149" class="small">Region: All ▾</text>
  <rect class="box" x="354" y="130" width="180" height="30"/>
  <text x="366" y="149" class="small">🔍 Search country…</text>

  <!-- Status + freshness -->
  <rect class="badge" x="560" y="130" width="90" height="30" rx="14"/>
  <text x="576" y="149" class="small">PUBLISHED</text>
  <rect class="box" x="50" y="172" width="600" height="26"/>
  <text x="62" y="189" class="small">Data freshness: OWID release 2026-08 · ingested 2 days ago · scorecard up to date ✓</text>

  <!-- Table header -->
  <rect class="boxdark" x="50" y="212" width="720" height="30"/>
  <text x="62" y="231" class="h2">Rank</text>
  <text x="120" y="231" class="h2">Country</text>
  <text x="300" y="231" class="h2">TTI Score (0–100)</text>
  <text x="560" y="231" class="h2">5y Trend</text>
  <text x="650" y="231" class="h2">Flags</text>

  <!-- Rows -->
  <g>
    <rect class="box" x="50" y="246" width="720" height="34"/>
    <text x="66" y="268" class="label">1</text>
    <text x="120" y="268" class="label">Country A</text>
    <rect class="scoretrack" x="300" y="255" width="200" height="14"/>
    <rect class="scorebar" x="300" y="255" width="176" height="14"/>
    <text x="508" y="268" class="small">88</text>
    <text x="566" y="268" class="label">▲</text>
    <text x="650" y="268" class="small">—</text>
  </g>
  <g>
    <rect class="box" x="50" y="284" width="720" height="34"/>
    <text x="66" y="306" class="label">2</text>
    <text x="120" y="306" class="label">Country B</text>
    <rect class="scoretrack" x="300" y="293" width="200" height="14"/>
    <rect class="scorebar" x="300" y="293" width="152" height="14"/>
    <text x="508" y="306" class="small">76</text>
    <text x="566" y="306" class="label">▲</text>
    <text x="650" y="306" class="small">—</text>
  </g>
  <g>
    <rect class="box" x="50" y="322" width="720" height="34"/>
    <text x="66" y="344" class="label">3</text>
    <text x="120" y="344" class="label">Country C</text>
    <rect class="scoretrack" x="300" y="331" width="200" height="14"/>
    <rect class="scorebar" x="300" y="331" width="118" height="14"/>
    <text x="508" y="344" class="small">59</text>
    <text x="566" y="344" class="label">▼</text>
    <text x="650" y="344" class="small">insufficient data</text>
  </g>
  <g>
    <rect class="box" x="50" y="360" width="720" height="34"/>
    <text x="66" y="382" class="label">4</text>
    <text x="120" y="382" class="label">Country D</text>
    <rect class="scoretrack" x="300" y="369" width="200" height="14"/>
    <rect class="scorebar" x="300" y="369" width="96" height="14"/>
    <text x="508" y="382" class="small">48</text>
    <text x="566" y="382" class="label">►</text>
    <text x="650" y="382" class="small">micro-state</text>
  </g>
  <g>
    <rect class="box" x="50" y="398" width="720" height="34"/>
    <text x="66" y="420" class="label">5</text>
    <text x="120" y="420" class="label">Country E</text>
    <rect class="scoretrack" x="300" y="407" width="200" height="14"/>
    <rect class="scorebar" x="300" y="407" width="70" height="14"/>
    <text x="508" y="420" class="small">35</text>
    <text x="566" y="420" class="label">▼</text>
    <text x="650" y="420" class="small">excluded</text>
  </g>

  <!-- Pagination + actions -->
  <rect class="box" x="50" y="450" width="150" height="28"/>
  <text x="62" y="468" class="small">◀ 1 2 3 … 12 ▶</text>
  <rect class="btn" x="560" y="450" width="210" height="32"/>
  <text x="586" y="471" class="label">Open country detail ▸</text>

  <!-- Version strip -->
  <rect class="box" x="50" y="500" width="720" height="26"/>
  <text x="62" y="517" class="small">Scorecard version v3.0 · approved by Reviewer · published automatically 2026-08-25 · full history ▸</text>

  <!-- Callouts -->
  <rect class="callout" x="820" y="130" width="215" height="58" rx="3"/>
  <text x="830" y="148" class="callouttext">FR-42: Filter scorecard by year</text>
  <text x="830" y="163" class="callouttext">and region; search by country.</text>
  <line class="calloutline" x1="820" y1="152" x2="534" y2="145"/>

  <rect class="callout" x="820" y="205" width="215" height="72" rx="3"/>
  <text x="830" y="223" class="callouttext">FR-08: "Requires Refresh" flag —</text>
  <text x="830" y="238" class="callouttext">answers AS-IS pain point:</text>
  <text x="830" y="253" class="callouttext">"scorecard silently becomes stale".</text>
  <line class="calloutline" x1="820" y1="230" x2="650" y2="185"/>

  <rect class="callout" x="820" y="300" width="215" height="72" rx="3"/>
  <text x="830" y="318" class="callouttext">FR-28/43: Governance flags from</text>
  <text x="830" y="333" class="callouttext">data model (insufficient_data,</text>
  <text x="830" y="348" class="callouttext">micro-state, excluded_from_ranking).</text>
  <line class="calloutline" x1="820" y1="330" x2="770" y2="344"/>

  <rect class="callout" x="820" y="470" width="215" height="58" rx="3"/>
  <text x="830" y="488" class="callouttext">FR-04/05: Version history visible</text>
  <text x="830" y="503" class="callouttext">on every published scorecard.</text>
  <line class="calloutline" x1="820" y1="495" x2="770" y2="513"/>
</svg>
